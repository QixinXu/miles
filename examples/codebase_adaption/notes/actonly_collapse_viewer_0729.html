<title>ACT-only Collapse — Trajectory Casebook</title>
<style>
:root{
  --bg:#0f1317; --panel:#161c22; --panel2:#1c242c; --line:#242e37;
  --ink:#d6dde3; --muted:#84939e; --accent:#d9a441;
  --ok:#5fb178; --bad:#d1685a; --cmd:#7fb3d5; --obs:#95a5b0;
  --mono:ui-monospace,'SF Mono',Menlo,Consolas,monospace;
  --sans:system-ui,-apple-system,'Segoe UI',sans-serif;
}
:root[data-theme="light"]{
  --bg:#f5f6f5; --panel:#ffffff; --panel2:#eef0f1; --line:#dde2e5;
  --ink:#242b31; --muted:#68757f; --accent:#a8791c;
  --ok:#2e7d4f; --bad:#b04537; --cmd:#2c6e9e; --obs:#5c6b75;
}
@media (prefers-color-scheme: light){
  :root:not([data-theme="dark"]){
    --bg:#f5f6f5; --panel:#ffffff; --panel2:#eef0f1; --line:#dde2e5;
    --ink:#242b31; --muted:#68757f; --accent:#a8791c;
    --ok:#2e7d4f; --bad:#b04537; --cmd:#2c6e9e; --obs:#5c6b75;
  }
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.55 var(--sans)}
.app{display:grid;grid-template-columns:300px 1fr;min-height:100vh}
@media(max-width:820px){.app{grid-template-columns:1fr}.side{position:static;height:auto;border-right:0;border-bottom:1px solid var(--line)}}
.side{border-right:1px solid var(--line);padding:18px 14px;position:sticky;top:0;height:100vh;overflow-y:auto}
.side h1{font:700 15px/1.3 var(--mono);margin:0 0 2px;letter-spacing:.02em}
.side .sub{color:var(--muted);font-size:12px;margin-bottom:16px}
.phase{margin-bottom:14px}
.phase .ph{font:600 11px var(--mono);color:var(--accent);text-transform:uppercase;letter-spacing:.08em;margin-bottom:6px}
.case-btn{display:block;width:100%;text-align:left;background:none;border:1px solid transparent;border-radius:6px;
  padding:7px 9px;color:var(--ink);cursor:pointer;font:12px var(--mono);margin-bottom:3px}
.case-btn:hover{background:var(--panel2)}
.case-btn.active{background:var(--panel2);border-color:var(--line)}
.case-btn:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.case-btn .t{display:block;font-weight:600}
.case-btn .m{display:block;color:var(--muted);font-size:11px;margin-top:2px}
.dot{display:inline-block;width:7px;height:7px;border-radius:50%;margin-right:6px;vertical-align:1px}
.main{padding:22px 26px;max-width:980px}
.chead{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:14px 16px;margin-bottom:14px}
.chead h2{margin:0 0 4px;font:700 16px var(--mono);text-wrap:balance}
.chead .inst{font:12px var(--mono);color:var(--muted);word-break:break-all}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:9px}
.chip{font:600 11px var(--mono);padding:2px 9px;border-radius:99px;border:1px solid var(--line);color:var(--muted)}
.chip.ok{color:var(--ok);border-color:var(--ok)}
.chip.bad{color:var(--bad);border-color:var(--bad)}
.chip.acc{color:var(--accent);border-color:var(--accent)}
.note{margin-top:10px;padding:9px 12px;background:var(--panel2);border-left:3px solid var(--accent);border-radius:0 6px 6px 0;font-size:13px}
.memrow{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:14px}
@media(max-width:820px){.memrow{grid-template-columns:1fr}}
.mem{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:10px 12px;min-width:0}
.mem .lbl{font:600 11px var(--mono);color:var(--muted);text-transform:uppercase;letter-spacing:.07em;margin-bottom:6px}
.mem pre{margin:0;font:11.5px/1.5 var(--mono);white-space:pre-wrap;word-break:break-word;max-height:230px;overflow-y:auto;color:var(--ink)}
.turn{background:var(--panel);border:1px solid var(--line);border-radius:8px;margin-bottom:10px;overflow:hidden}
.turn.badturn{border-left:3px solid var(--bad)}
.turn .th{display:flex;align-items:center;gap:10px;padding:6px 12px;background:var(--panel2);font:600 11px var(--mono);color:var(--muted)}
.turn .th .fin{margin-left:auto}
.fin{font:600 10px var(--mono);padding:1px 7px;border-radius:99px;border:1px solid var(--line)}
.fin.length{color:var(--bad);border-color:var(--bad)}
.assist{padding:10px 12px;font:12px/1.55 var(--mono);white-space:pre-wrap;word-break:break-word;color:var(--ink)}
.assist.long{max-height:280px;overflow:hidden;position:relative}
.assist.long.open{max-height:none}
.expand{display:block;width:100%;border:0;border-top:1px dashed var(--line);background:var(--panel2);
  color:var(--accent);font:600 11px var(--mono);padding:5px;cursor:pointer}
.expand:focus-visible{outline:2px solid var(--accent)}
.cmdline{padding:7px 12px;border-top:1px solid var(--line);font:12px var(--mono);color:var(--cmd);white-space:pre-wrap;word-break:break-word}
.cmdline b{color:var(--muted);font-weight:600}
.nocmd{padding:7px 12px;border-top:1px solid var(--line);font:600 11px var(--mono);color:var(--bad)}
details.obs{border-top:1px solid var(--line)}
details.obs summary{padding:6px 12px;font:600 11px var(--mono);color:var(--obs);cursor:pointer;list-style:none}
details.obs summary::before{content:'▸ '}
details.obs[open] summary::before{content:'▾ '}
details.obs pre{margin:0;padding:0 12px 10px;font:11.5px/1.5 var(--mono);white-space:pre-wrap;word-break:break-word;color:var(--obs)}
mark.spam{background:none;color:var(--bad);font-weight:600}
@media (prefers-reduced-motion: no-preference){.assist.long{transition:max-height .2s}}

<script>
const D = JSON.parse(document.getElementById('data').textContent);
const byTag = {}; D.cases.forEach(c => byTag[c.tag] = c);
const nav = document.getElementById('nav'), main = document.getElementById('main');
function esc(s){return (s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;');}
function markSpam(h){return h.replace(/((?:OK!?\s*){12,})/g, m => '<mark class="spam">' + m + '</mark>');}
D.phases.forEach(([ph, tags]) => {
  const div = document.createElement('div'); div.className = 'phase';
  div.innerHTML = '<div class="ph">' + esc(ph) + '</div>';
  tags.forEach(tag => {
    const c = byTag[tag]; if (!c) return;
    const o = c.outcome || {};
    const b = document.createElement('button'); b.className = 'case-btn'; b.dataset.tag = tag;
    b.innerHTML = '<span class="t"><span class="dot" style="background:var(--' + (o.success ? 'ok' : 'bad') + ')"></span>'
      + esc(D.notes[tag][0]) + '</span><span class="m">r' + c.rollout + ' · ' + (o.turns||0) + ' turns · '
      + esc((c.instance_id||'').split('.').pop().slice(0,26)) + '</span>';
    b.onclick = () => show(tag);
    div.appendChild(b);
  });
  nav.appendChild(div);
});
function show(tag){
  document.querySelectorAll('.case-btn').forEach(b => b.classList.toggle('active', b.dataset.tag === tag));
  const c = byTag[tag], o = c.outcome || {}, note = D.notes[tag];
  let h = '<div class="chead"><h2>' + esc(note[0]) + '</h2><div class="inst">' + esc(c.instance_id) + '</div>'
    + '<div class="chips">'
    + '<span class="chip acc">rollout ' + c.rollout + '</span>'
    + '<span class="chip ' + (o.success?'ok':'bad') + '">' + (o.success?'SUCCESS':'FAIL') + '</span>'
    + '<span class="chip">reward ' + (o.reward!=null?o.reward:'—') + '</span>'
    + '<span class="chip">' + (o.turns||0) + ' turns / ' + (o.steps!=null?o.steps:'?') + ' steps</span>'
    + '<span class="chip">' + esc(o.eval_status||'') + '</span>'
    + '<span class="chip">trial_pos ' + c.trial_pos + '</span>'
    + '</div><div class="note">' + esc(note[1]) + '</div></div>';
  h += '<div class="memrow">'
    + '<div class="mem"><div class="lbl">Memory in (context before this task)</div><pre>' + (c.memory_in ? markSpam(esc(c.memory_in)) : '<i>(empty — no accumulated memory for this task)</i>') + '</pre></div>'
    + '<div class="mem"><div class="lbl">Memory out (WRITE output' + (c.write_finish==='length'?' · <mark class="spam">truncated</mark>':'') + ')</div><pre>' + (c.memory_out ? markSpam(esc(c.memory_out)) : '<i>(none)</i>') + '</pre></div>'
    + '</div>';
  c.turns.forEach((t, i) => {
    const bad = !t.action;
    const at = esc(t.assistant||''); const long = at.length > 1400;
    h += '<div class="turn' + (bad?' badturn':'') + '"><div class="th">TURN ' + (i+1)
      + (t.step!=null?' · step '+t.step:'') 
      + '<span class="fin' + (t.act_finish==='length'?' length':'') + '">' + esc(t.act_finish||'') + '</span></div>'
      + '<div class="assist' + (long?' long':'') + '" id="a' + i + '">' + markSpam(at) + '</div>'
      + (long ? '<button class="expand" data-t="a' + i + '">Show full text (' + at.length + ' chars)</button>' : '')
      + (t.action ? '<div class="cmdline"><b>$</b> ' + esc(t.action) + '</div>' : '<div class="nocmd">⌀ no parseable command — wasted turn</div>')
      + (t.observation ? '<details class="obs"><summary>observation</summary><pre>' + esc(t.observation) + '</pre></details>' : '')
      + '</div>';
  });
  main.innerHTML = h;
  main.querySelectorAll('.expand').forEach(b => b.onclick = () => {
    const el = document.getElementById(b.dataset.t);
    el.classList.toggle('open');
    b.textContent = el.classList.contains('open') ? 'Collapse' : 'Show full text';
  });
  window.scrollTo(0, 0);
}
show('mid_success');
</script>
